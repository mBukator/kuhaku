name: Bug report
description: Report a defect in a component, token, the CLI, or the docs
title: "fix: "
labels: ["bug"]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for reporting. A minimal reproduction is the single most useful thing you can provide - issues without one may be closed.
    - type: dropdown
      id: area
      attributes:
          label: Area
          description: Which part is affected?
          options:
              - A component
              - Tokens (color / type / motion)
              - CLI (kuhaku)
              - Docs site
              - Not sure
      validations:
          required: true
    - type: input
      id: name
      attributes:
          label: Component or token name
          description: If a specific component or token is involved, name it.
          placeholder: e.g. Button, --motion-duration-fast
    - type: textarea
      id: description
      attributes:
          label: Description
          description: A clear and concise description of the bug.
      validations:
          required: true
    - type: input
      id: reproduction
      attributes:
          label: Reproduction link
          description: A minimal reproduction (StackBlitz, CodeSandbox, or a small repo).
          placeholder: https://
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          value: |
              1.
              2.
              3.
    - type: textarea
      id: expected
      attributes:
          label: Expected behavior
      validations:
          required: true
    - type: textarea
      id: actual
      attributes:
          label: Actual behavior
          description: Include any console errors.
      validations:
          required: true
    - type: textarea
      id: environment
      attributes:
          label: Environment
          value: |
              - Kuhaku version / commit:
              - Framework (e.g. Next.js version):
              - OS / browser:
      validations:
          required: true
    - type: checkboxes
      id: a11y
      attributes:
          label: Accessibility / motion context (tick if relevant)
          options:
              - label: "Reproduces with `prefers-reduced-motion: reduce`"
              - label: 'Reproduces with `data-a11y="strict"`'
