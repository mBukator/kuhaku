name: Dependabot lockfile

# Dependabot bumps package.json but does not regenerate the workspace
# bun.lock, so the CI frozen install (ci.yml) fails. And a bun.lock
# regenerated on Windows does not satisfy the frozen install on Linux, so
# it cannot be fixed from a local checkout. This job regenerates bun.lock
# on the Linux runner and commits it back to the Dependabot PR branch.
#
# The push uses a PAT (stored as a Dependabot secret) rather than the
# default GITHUB_TOKEN, because commits pushed with GITHUB_TOKEN do not
# re-trigger workflows - and CI must re-run on the corrected commit for
# the required "ci" check to report.
#
# Setup (one time): create a PAT with Contents read/write on this repo and
# add it under Settings -> Secrets and variables -> Dependabot as
# DEPENDABOT_LOCKFILE_PAT.

on:
    pull_request:
        branches: [develop]

permissions:
    contents: read

jobs:
    lockfile:
        name: sync bun.lock
        if: github.actor == 'dependabot[bot]'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout PR branch
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.head_ref }}
                  token: ${{ secrets.DEPENDABOT_LOCKFILE_PAT }}

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.11

            - name: Regenerate bun.lock
              run: bun install

            - name: Commit and push if the lockfile changed
              run: |
                  if git diff --quiet -- bun.lock; then
                      echo "bun.lock already in sync; nothing to do."
                      exit 0
                  fi
                  git config user.name "dependabot[bot]"
                  git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
                  git add bun.lock
                  git commit -m "build(deps): regenerate bun.lock" -m "Dependabot updated the manifests without regenerating the workspace lockfile; sync it so bun install --frozen-lockfile passes on CI."
                  git push
