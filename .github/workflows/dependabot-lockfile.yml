name: Dependabot lockfile

# Dependabot bumps package.json without regenerating bun.lock, and a lockfile rebuilt on
# Windows fails the Linux frozen install, so it is rebuilt here on Linux.
# Pushes use a PAT: commits pushed with GITHUB_TOKEN never re-trigger CI. The PAT
# (Contents read/write) is a Dependabot secret named DEPENDABOT_LOCKFILE_PAT.

on:
    pull_request:
        branches: [develop, main]

permissions:
    contents: read

jobs:
    lockfile:
        name: sync bun.lock
        if: github.actor == 'dependabot[bot]'
        runs-on: ubuntu-latest

        # Husky hooks must not run on the bot commit; ci.yml is the gate.
        env:
            HUSKY: "0"

        steps:
            - name: Checkout PR branch
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.head_ref }}
                  token: ${{ secrets.DEPENDABOT_LOCKFILE_PAT }}

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.11

            - name: Regenerate bun.lock
              run: bun install --ignore-scripts

            - name: Commit and push if the lockfile changed
              run: |
                  if git diff --quiet -- bun.lock; then
                      echo "bun.lock already in sync; nothing to do."
                      exit 0
                  fi
                  git config user.name "dependabot[bot]"
                  git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
                  git add bun.lock
                  git commit --no-verify -m "build(deps): regenerate bun.lock" -m "Sync the workspace lockfile after Dependabot's manifest bump so frozen install passes."
                  git push --no-verify
