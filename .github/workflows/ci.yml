name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

permissions:
    contents: read

jobs:
    ci:
        name: ci
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.11

            # Vitest runs on Node, not Bun, and needs ^22.12.
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # From the registry, so the pinned Playwright picks the browser build.
            - name: Install Chromium
              working-directory: packages/registry
              run: bunx playwright install --with-deps chromium

            - name: Lint
              run: bun run lint

            - name: Type check
              run: bun run typecheck

            - name: Format check
              run: bun run format:check

            - name: Build
              run: bun run build

            - name: Registry output is committed
              run: |
                  if [ -n "$(git status --porcelain -- apps/docs/public/r)" ]; then
                      git status --short -- apps/docs/public/r
                      echo "apps/docs/public/r is stale: run bun run build and commit the result."
                      exit 1
                  fi

            - name: Test
              run: bun run test
